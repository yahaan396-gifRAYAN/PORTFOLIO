<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Ai ChatBot - ARNAV YADAV</title> 
 
    <!-- tailwind css linking --> 
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
 
    <style> 
        body { 
            background-color: #0a1429; 
        } 
    </style> 
</head> 
 
<body class="text-white h-screen flex flex-col"> 
 
    <!-- header --> 
    <div class="bg-slate-900 p-4 text-center text-xl font-bold border-b 
border-slate-500"> 
      SHAURYA's 𝐀𝐈-𝐂𝐇𝐀𝐓𝐁𝐎𝐓
    </div> 
 
    <!-- Chat screen --> 
    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-4"> 
        <div class="bg-slate-700 p-3 rounded-lg max-w-xl"> 
           Hello! How may I assist you today? 
        </div> 
    </div> 
 
    <div class="p-4 bg-slate-800 border-t border-slate-500 flex gap-3"> 
        <input type="text" id="message" placeholder="Enter your prompt..." onkeydown="if(event.key==='Enter') sendMessage()"
            class="flex-1 p-3 rounded bg-slate-800 outline-none"> 
                 <button class="bg-blue-600 px-6 rounded hover:bg-blue-700" 
onclick="sendMessage()">𝑺𝑬𝑵𝑫</button> 
    </div> 
 
 
    <script src="script.js"></script> 
</body> 
 
</html>
